name: tests

# Run the gate (make test) on every push and pull request. Chez is the sole
# substrate; the JVM is used only as the conformance oracle (certify).
on:
  push:
  pull_request:

# A newer push to the same branch or PR makes the run in flight moot, so it is
# cancelled rather than left to hold runners for half an hour. main keeps
# every run: each commit there is one someone may bisect to. A PR's runs are
# grouped by its number, not its branch name: head_ref is the bare branch name,
# so two PRs from different forks that both use, say, fix/typo would share a
# group and cancel each other. A push groups by its ref.
concurrency:
  group: tests-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The gate (make test) as parallel shards. The runner has 4 cores and the
  # gate is ~180 independent targets, so one job spent ~27 minutes working
  # through them; `make ci-shard` deals the sorted gate list out SHARD of
  # SHARDS, so the shards between them still run every gate exactly once, a
  # new gate needs no edit here, and each shard's log holds only its own
  # targets. fail-fast is off so one red shard doesn't hide another's result.
  gate:
    name: test (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive   # vendor/irregex, used by the Chez regex shim

      - name: Set up Chez, Gambit and the certify oracle
        uses: ./.github/actions/setup-chez

      - name: Gate (shard ${{ matrix.shard }}/4)
        # `make test` = the self-host byte-fixpoint (the rebuilt seed must equal
        # the checked-in seed byte-for-byte — holds cross-platform on the pinned
        # source-built Chez) + the behavior gates (`make ci`: corpus/unit/smoke/
        # buildsmoke/sci/certify). buildsmoke links a real binary (the source
        # build ships the kernel dev files).
        # -j overlaps the independent gates (ci is a plain dependency list);
        # -Oline keeps per-recipe output contiguous for failure reading.
        env:
          # The Chez built above is PIC, so `jolt build --library` links here and
          # buildlibsmoke must actually run. This makes its skip paths fatal, so
          # the gate cannot go back to reporting green without testing.
          JOLT_REQUIRE_BUILDLIB: "1"
          # Same for the gambit gates: with a Gambit built above, a skip is a
          # failure, so they cannot go back to being the no-ops they were.
          JOLT_REQUIRE_GAMBIT: "1"
          # Every Chez CI builds carries jolt's kernel patches
          # (ci/apply-chez-patches.sh); a kernel without them is a stale cache
          # or a patch that stopped applying, not a stock install to tolerate.
          JOLT_REQUIRE_LOCKFREE_CHEZ: "1"
        # TMPDIR on the runner's disk: from ubuntu-26.04, /tmp is a tmpfs with a
        # size limit, and the build gates' mktemp dirs (shakelocal keeps two
        # binaries per app until it exits) ran it out with EDQUOT.
        run: TMPDIR="$RUNNER_TEMP" make CHEZ=/opt/chez/bin/chez GAMBIT_PREFIX=/opt/gambit -j"$(nproc)" -Oline ci-shard SHARD-SET=test SHARD=${{ matrix.shard }} SHARDS=4

  # The check that says the whole gate passed, under the name the single job
  # had, so anything that waits on "test" (a required status check, a person)
  # still waits on all of it.
  test:
    name: test
    needs: gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.gate.result }}" = success

  # The gate on bionic (Android/Termux, #943): jolt and its pinned Chez build in
  # termux/termux-docker on an arm64 runner, the release smokes run there
  # (ci/termux-build.sh), and then `make bionic-ci` -- the full CI gate: the ten
  # gates #1148 used to exclude (charsets, PIC kernel, CTS, the off-Android
  # fixtures) all pass on bionic now. Android has no
  # /tmp and many gates' fixtures write there by name, so the entrypoint makes one
  # as root before dropping to the Termux user: the gates are there to exercise
  # jolt, and jolt itself uses $TMPDIR.
  #
  # bionic-ci's gates run as shards, like the gate job's, three ways: each shard repeats the container
  # setup and the jolt build (~2 minutes), so more shards stop paying. The
  # bionic Chez the Makefile provisions (bionic-provision-chez.sh, ~2 minutes
  # of the build) is cached between runs: termux-build.sh copies the
  # workspace in, so a restored prefix is there for make to find, and copies a
  # fresh one back out to target/bionic-chez for the save step.
  android-gate:
    name: Android (bionic ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Month (Termux image cache key)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The image comes from the cache, not Docker Hub, when it can: anonymous
      # pulls from the shared runners hit Docker Hub's rate limit (ci/pull-image.sh).
      - name: Restore Termux image
        id: termux-image
        uses: actions/cache/restore@v5
        with:
          path: ~/termux-image.tar
          key: termux-docker-aarch64-${{ steps.month.outputs.month }}
      - name: Pull Termux image
        run: sh ci/pull-image.sh termux/termux-docker:aarch64 "$HOME/termux-image.tar"
      - name: Save Termux image
        if: steps.termux-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/termux-image.tar
          key: termux-docker-aarch64-${{ steps.month.outputs.month }}
      # Keyed on what decides the build: the makes pin (which names the Chez
      # version), the provisioning script and jolt's kernel patches.
      - name: Bionic Chez cache key
        id: bionic-chez
        run: echo "key=bionic-chez-$(sed -n 's/^V := //p' Makefile)-${{ hashFiles('host/chez/bionic-provision-chez.sh', 'host/chez/chez-patches/*.patch') }}" >> "$GITHUB_OUTPUT"
      - name: Restore bionic Chez
        id: bionic-chez-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/local
          key: ${{ steps.bionic-chez.outputs.key }}
      - name: Build and gate jolt in Termux (shard ${{ matrix.shard }}/3)
        run: |
          mkdir -p target/release
          chmod 777 target target/release
          docker run --rm --entrypoint /system/bin/sh -v "$PWD":/src \
            termux/termux-docker:aarch64 \
            -c 'mkdir -p /tmp && chmod 1777 /tmp && exec /entrypoint.sh sh /src/ci/termux-build.sh ci-shard SHARD-SET=ci SHARD=${{ matrix.shard }} SHARDS=3'
      - name: Stage bionic Chez for the cache
        if: steps.bionic-chez-cache.outputs.cache-hit != 'true'
        run: |
          rm -rf .cache/local
          mkdir -p .cache
          cp -R target/bionic-chez .cache/local
      - name: Save bionic Chez
        if: steps.bionic-chez-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/local
          key: ${{ steps.bionic-chez.outputs.key }}

  android:
    name: Android (bionic)
    needs: android-gate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.android-gate.result }}" = success

  # No AI-assistant attribution in what a push or PR adds: tools/attributioncheck.sh
  # over the pushed range (push) or the PR's commits and its description (PR).
  # Its own job because it needs history — the test job's checkout is shallow,
  # so origin/main..HEAD is not there to scan — and needs no Chez.
  clj-kondo:
    name: clj-kondo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      KONDO_VERSION: 2026.08.04
      KONDO_SHA256: 25dce55f597cc7f034f6c5f8bf4195128e3efeb3b22710a066fb67b489e70a3b
    steps:
      - uses: actions/checkout@v5

      - name: Install clj-kondo
        run: |
          zip="clj-kondo-$KONDO_VERSION-linux-static-amd64.zip"
          curl -fsSL -o "$RUNNER_TEMP/$zip" \
            "https://github.com/clj-kondo/clj-kondo/releases/download/v$KONDO_VERSION/$zip"
          echo "$KONDO_SHA256  $RUNNER_TEMP/$zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$zip" -d "$RUNNER_TEMP/kondo"
          echo "$RUNNER_TEMP/kondo" >> "$GITHUB_PATH"

      - name: Lint
        run: make kondocheck

  attribution:
    name: No AI attribution in commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Commits in range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && ! echo "$BEFORE" | grep -q '^0*$' && git cat-file -e "$BEFORE" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~20..HEAD"   # a new branch or a force-push: the recent commits
          fi
          echo "scanning $range"
          sh tools/attributioncheck.sh "$range"
      - name: PR description
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n' "$BODY" | sh tools/attributioncheck.sh --text

  windows-deps:
    name: Windows dependency paths
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive   # vendor/irregex, used by the Chez regex shim

      # Match the release builder: a native MINGW64 toolchain and threaded
      # Chez 10.4.1 built as ta6nt. Keep this job focused on dependency paths;
      # the full gate still contains POSIX-specific cases and runs above.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # inherit the runner PATH so GITHUB_PATH additions (the chez wrapper
          # dir) are visible inside the msys2 shell
          path-type: inherit
          install: >-
            git make vim zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ntldd

      - name: Cache Chez Scheme
        id: cache-chez-win
        uses: actions/cache@v5
        with:
          path: chez-install
          key: chez-windows-latest-v10.4.1-mingw64-${{ hashFiles('host/chez/chez-patches/*.patch') }}

      - name: Build Chez Scheme from source
        if: steps.cache-chez-win.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme.git /tmp/chez-src
          sh "$GITHUB_WORKSPACE/ci/apply-chez-patches.sh" /tmp/chez-src
          cd /tmp/chez-src
          ./configure --threads
          make -j"$(nproc)"
          # `make install` drives the unix installsh through cmd and dies; the
          # build tree has everything — assemble the layout by hand. Boot files
          # sit next to scheme.exe (that's where the Windows kernel looks).
          inst="$GITHUB_WORKSPACE/chez-install"
          mkdir -p "$inst/bin" "$inst/csv"
          cp ta6nt/bin/ta6nt/*.exe "$inst/bin/"
          cp ta6nt/bin/ta6nt/*.dll "$inst/bin/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/bin/"
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/csv/"
          cp ta6nt/boot/ta6nt/scheme.h "$inst/csv/"
          cp ta6nt/boot/ta6nt/equates.h "$inst/csv/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/libkernel.a "$inst/csv/" || { echo "libkernel.a not found:"; find ta6nt -name "*.a" -o -name "kernel*"; exit 1; }

      - name: Put chez on PATH
        run: |
          bindir="$GITHUB_WORKSPACE/chez-install/bin"
          { echo '#!/bin/sh'; echo "exec \"$bindir/scheme.exe\" \"\$@\""; } > "$bindir/chez"
          chmod +x "$bindir/chez"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "JOLT_CHEZ_CSV=$GITHUB_WORKSPACE/chez-install/csv" >> "$GITHUB_ENV"
          # cc is the build's compiler name; alias it to mingw gcc
          { echo '#!/bin/sh'; echo 'exec gcc "$@"'; } > "$bindir/cc"
          chmod +x "$bindir/cc"

      - name: Show Chez version
        run: chez --version

      - name: Gate native dependency paths and Maven resolver
        run: make CHEZ=./chez-install/bin/chez depsunit mvnhttp

      # The Windows-shaped path, PATH and PROCESS rows. depsunit and mvnhttp
      # above spawn nothing and initialize their own Winsock, which is exactly
      # why this job missed jolt-lang/jolt#1108 — every subprocess spawn failed
      # on Windows, silently, for a whole release. winplatform ends in a LIVE
      # spawn through ProcessBuilder, so on this runner it drives CreateProcessW
      # end to end. winparity replays the #1108/#1109/#1117/#1118/#1119 repros
      # (spawn, PushbackReader close, file: URLs, directory mtimes) through the
      # CLI on this runner's filesystem.
      - name: Gate the Windows path, PATH and process rows
        run: make CHEZ=./chez-install/bin/chez winplatform winpath winparity closedstdout stderrsplit

      # #1337: the flonum payload probe read bytes in front of 2.5, and with no
      # fault handler in a MinGW scheme.exe that killed the process at load
      # whenever 2.5 landed first in a fresh segment — reliably for
      # `> f 2>&1`, where stdout and stderr share one console port. flonumdisp
      # builds that layout on purpose; the second command is the report.
      - name: Gate the flonum payload probe
        run: |
          make CHEZ=./chez-install/bin/chez flonumdisp
          ./chez-install/bin/scheme.exe --script host/chez/cli.ss -e '(println 1)' > merged.txt 2>&1
          tr -d '\r' < merged.txt | grep -qx 1

      # java.util.zip in script mode under MSYS2 (#916). There are no jolt_z_*
      # names there: zlib.ss binds the process's own zlib if scheme.exe exports
      # one, else MSYS2's zlib1.dll from /mingw64/bin (mingw-w64-x86_64-zlib,
      # installed above). The spec makes this a SHOULD until a run shows it, so a
      # failure here does not fail the job. A run that passes says so in the job
      # summary: once runs show it works, drop continue-on-error and make it a
      # MUST (#916).
      - name: Script mode inflates and deflates (MSYS2)
        continue-on-error: true
        run: |
          export PATH="/mingw64/bin:$PATH"
          got="$(./chez-install/bin/chez --script host/chez/cli.ss -e '(let [b (java.io.ByteArrayOutputStream.)] (with-open [o (java.util.zip.GZIPOutputStream. b)] (.write o (.getBytes (apply str (repeat 1000 "zip")) "UTF-8"))) [(count (slurp (java.util.zip.GZIPInputStream. (java.io.ByteArrayInputStream. (.toByteArray b))))) (< (.size b) 100)])')"
          test "$got" = "[3000 true]" || { echo "script-mode gzip round trip gave '$got', want [3000 true]"; exit 1; }
          echo "::notice::script-mode gzip round trip: $got"

      # Use PowerShell so JOLT_PWD retains its native drive-rooted spelling.
      # The MSYS shell can translate it before the runtime sees the value,
      # which would make this regression check vacuous.
      - name: Resolve a fixture from a native absolute project directory
        shell: powershell
        run: |
          $project = Join-Path $env:RUNNER_TEMP 'absolute-path-project'
          $marker = Join-Path $project 'marker-src'
          New-Item -ItemType Directory -Force -Path $marker | Out-Null
          Set-Content -NoNewline -Encoding ascii `
            -Path (Join-Path $project 'deps.edn') `
            -Value '{:paths ["marker-src"]}'
          $env:JOLT_PWD = (Resolve-Path $project).Path
          if ($env:JOLT_PWD -notmatch '^[A-Za-z]:[\\/]') {
            throw "expected a drive-absolute JOLT_PWD, got: $env:JOLT_PWD"
          }
          $scheme = Join-Path $env:GITHUB_WORKSPACE 'chez-install\bin\scheme.exe'
          $resolved = (& $scheme --script host\chez\cli.ss -Spath 2>&1 | Out-String)
          Write-Host $resolved
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $resolved.Contains('marker-src')) {
            throw "resolved path did not contain the fixture's declared marker root"
          }
          $env:JOLT_EXPECTED_ROOTED = $env:JOLT_PWD.Substring(0, 2) + '\rooted.txt'
          # Avoid string literals in the native `-e` argument: Windows
          # PowerShell 5.1 removes their quotes while constructing argv.
          $probe = '(let [p (str (char 92) (name (quote rooted.txt))) f (java.io.File. p)] (and (false? (.isAbsolute f)) (= (System/getenv (name (quote JOLT_EXPECTED_ROOTED))) (.getAbsolutePath f))))'
          $rooted = (& $scheme --script host\chez\cli.ss -e $probe 2>&1 | Out-String).Trim()
          Write-Host $rooted
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($rooted -ne 'true') {
            throw "current-drive-rooted File resolution did not match user.dir's drive"
          }

      # The Windows path defects that the per-platform gates above model but
      # cannot observe: #992 (a drive-absolute FILE argument read as
      # project-relative, so the runtime opened "./C:/…") and #991
      # (getCanonicalPath prefixing "/" to a drive-absolute path, so the value
      # it returned resolved against the current drive and could not be opened).
      # PowerShell again, so the drive-rooted spellings reach the runtime as
      # the user typed them rather than as MSYS translations of them.
      - name: Drive-absolute FILE argument and canonical paths
        shell: powershell
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE 'chez-install\bin\scheme.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'winpaths'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $script = Join-Path $dir 'hello.clj'
          Set-Content -NoNewline -Encoding ascii -Path $script -Value '(println :hello-from-file)'

          # JOLT_PWD unset is the prebuilt binary's own arrangement: the project
          # directory is ".", so a mis-classified absolute path becomes "./C:/…".
          Remove-Item Env:\JOLT_PWD -ErrorAction SilentlyContinue
          foreach ($spelling in @(($script -replace '\\','/'), $script)) {
            $out = (& $scheme --script host\chez\cli.ss $spelling 2>&1 | Out-String)
            Write-Host "$spelling => $out"
            if ($LASTEXITCODE -ne 0) { throw "jolt <$spelling> exited $LASTEXITCODE" }
            if (-not $out.Contains(':hello-from-file')) {
              throw "a drive-absolute FILE argument did not run: $spelling"
            }
          }

          # getCanonicalPath must answer a path that can be written and read
          # back, and must answer the SAME path for both separator spellings —
          # the identity comparison it exists for.
          $probe = 'x'
          $probe = '(let [d (System/getenv (name (quote WINPATH_DIR)))' +
                   '      p (str d (char 47) (name (quote out.txt)))' +
                   '      b (.replace p (char 47) (char 92))' +
                   '      c (.getCanonicalPath (java.io.File. p))' +
                   '      c2 (.getCanonicalPath (java.io.File. b))]' +
                   '  (spit c (name (quote written)))' +
                   '  (println [(= c c2) (slurp c) (= (char 47) (.charAt c 0))]))'
          $env:WINPATH_DIR = $dir
          $out = (& $scheme --script host\chez\cli.ss -e $probe 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -ne '[true written false]') {
            throw "canonicalized drive-absolute path was not usable/stable: $out"
          }

          # The byte streams with a forward-slash spelling of a drive-absolute
          # path — what a download path looks like once a cache directory has
          # been joined with "/" — write where the native spelling reads, and
          # both spellings are absolute. (#711: FileOutputStream received
          # "C:/project/C:/Users/…" before the File shim preserved the drive.)
          $probe = '(let [d (System/getenv (name (quote WINPATH_DIR)))' +
                   '      native (str d (char 92) (name (quote bytes.bin)))' +
                   '      slash (.replace native (char 92) (char 47))]' +
                   '  (with-open [o (java.io.FileOutputStream. slash)] (.write o (byte-array [90])))' +
                   '  (with-open [i (java.io.FileInputStream. native)]' +
                   '    (println [(.isAbsolute (java.io.File. native)) (.isAbsolute (java.io.File. slash)) (.read i)])))'
          $out = (& $scheme --script host\chez\cli.ss -e $probe 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -ne '[true true 90]') {
            throw "a forward-slash drive-absolute path did not reach the byte streams: $out"
          }

      # The three defects of #1074, none of which a POSIX runner can observe.
      # test/chez/win-platform-test.ss pins the decisions with the platform as a
      # parameter; only a real Windows filesystem, PATH and process table can say
      # the decisions were the right ones. PowerShell again — Windows PowerShell
      # 5.1 strips the quotes off a string literal in a native argument, so the
      # probes spell their strings with (name (quote x)) and (char n), as the
      # path steps above do.
      - name: spit replaces an existing file
        shell: powershell
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE 'chez-install\bin\scheme.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'winspit'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $env:WINSPIT_DIR = $dir
          # spit stages into a sibling temp file and renames over the target, and
          # Windows refuses a rename onto an existing destination — so the SECOND
          # spit to any path threw, as did the FIRST spit to a createTempFile
          # target (which already exists). Both, plus append, in one probe.
          $probe = '(let [d (System/getenv (name (quote WINSPIT_DIR)))' +
                   '      p (str d (char 47) (name (quote t.txt)))' +
                   '      t (java.io.File/createTempFile (name (quote joltspit)) (str (char 46) (name (quote txt))))]' +
                   '  (spit p (name (quote a)))' +
                   '  (spit p (name (quote b)))' +
                   '  (spit t (name (quote c)))' +
                   '  (spit p (name (quote d)) :append true)' +
                   '  (println (pr-str [(slurp p) (slurp t)])))'
          $out = (& $scheme --script host\chez\cli.ss -e $probe 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -ne '["bd" "c"]') {
            throw "spit did not replace an existing target: $out"
          }

      - name: path.separator is ";" and the PATH readers agree
        shell: powershell
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE 'chez-install\bin\scheme.exe'
          # ":" is the drive suffix here, so a ":"-split of "C:/a;C:/b" answers
          # three garbage entries and fs/which never finds anything.
          # The entry count is the assertion rather than the entries themselves:
          # two is right and three is the bug, and how a Path renders its
          # separators is win-path-test.ss's question, not this one's.
          $probe = '(do (require (quote [babashka.fs :as fs]))' +
                   '  (let [two (str (name (quote C)) (char 58) (char 47) (name (quote a)) (char 59)' +
                   '                 (name (quote C)) (char 58) (char 47) (name (quote b)))]' +
                   '    (println (pr-str [(System/getProperty (name (quote path.separator)))' +
                   '                      java.io.File/pathSeparator' +
                   '                      (count (fs/split-paths two))' +
                   '                      (some? (fs/which (name (quote curl))))]))))'
          $out = (& $scheme --script host\chez\cli.ss -e $probe 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -ne '[";" ";" 2 true]') {
            throw "the PATH-list separator did not reach its readers: $out"
          }

      - name: ProcessBuilder starts a Windows program
        shell: powershell
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE 'chez-install\bin\scheme.exe'
          # Every spelling a caller actually uses: the bare name (which resolves
          # only through PATHEXT — curl IS curl.exe), the native drive-absolute
          # path, and its forward-slash spelling (what a joined cache directory
          # looks like). kmet's curl transport hits all of these.
          $env:WINCURL = (Get-Command curl.exe).Source
          $probe = '(do (require (quote [babashka.process :as proc]))' +
                   '  (let [v (str (char 45) (char 45) (name (quote version)))' +
                   '        native (System/getenv (name (quote WINCURL)))' +
                   '        slash (.replace native (char 92) (char 47))' +
                   '        run (fn [p] (:exit @(proc/process [p v] {:out :string :err :string})))]' +
                   '    (println (pr-str [(run (name (quote curl))) (run native) (run slash)]))))'
          $out = (& $scheme --script host\chez\cli.ss -e $probe 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($out -ne '[0 0 0]') {
            throw "a Windows program could not be resolved and started: $out"
          }

      - name: Path roots, java.io.tmpdir and listRoots are Windows-shaped
        shell: powershell
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE 'chez-install\bin\scheme.exe'
          # The java.nio.file Path shim had a POSIX-only root, so a drive path
          # was a relative path whose first segment happened to be "C:" —
          # fs/absolute? false, getParent off the drive letter. java.io.tmpdir
          # read only TMPDIR, which Windows does not set, and listRoots answered
          # "/" instead of the drives. TMPDIR is cleared here so the property
          # has to find TEMP the way a plain Windows process does. Paths render
          # with "\" as on the JVM, roots included.
          Remove-Item Env:\TMPDIR -ErrorAction SilentlyContinue
          $env:WINROOT_DIR = $env:SystemDrive
          $probe = '(do (require (quote [babashka.fs :as fs]))' +
                   '  (let [d (System/getenv (name (quote WINROOT_DIR)))' +
                   '        p (fs/path (str d (char 47) (name (quote Windows)) (char 47) (name (quote System32))))' +
                   '        tmp (System/getProperty (name (quote java.io.tmpdir)))]' +
                   '    (println (pr-str [(fs/absolute? p)' +
                   '                      (str (fs/parent p))' +
                   '                      (str (.getRoot p))' +
                   '                      (.startsWith (.toLowerCase tmp) (.toLowerCase d))' +
                   '                      (.isDirectory (java.io.File. tmp))' +
                   '                      (boolean (some (fn [r] (= (str r) (str d (char 92))))' +
                   '                                     (java.io.File/listRoots)))]))))'
          $out = (& $scheme --script host\chez\cli.ss -e $probe 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $drive = $env:SystemDrive
          # pr-str doubles each backslash, and a single-quoted PowerShell string
          # keeps both: this is C:\Windows as the JVM prints it
          $want = '[true "' + $drive + '\\Windows" "' + $drive + '\\" true true true]'
          if ($out -ne $want) {
            throw "the Path root / tmpdir / listRoots answers were not Windows-shaped: $out (want $want)"
          }

      # getCanonicalPath and toRealPath answer the long spelling of a path given
      # with an 8.3 alias, as the JVM does, so a directory named through %TEMP%
      # (which carries the short profile name) and through a child's cwd compare
      # equal (#1281). The alias comes from the filesystem itself; a volume with
      # short names disabled has none to give, and the step says so and passes.
      - name: Canonical paths expand 8.3 short names
        shell: powershell
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE 'chez-install\bin\scheme.exe'
          # %TEMP% rather than RUNNER_TEMP: the runner's work drive has short
          # names disabled, the system drive does not
          $long = Join-Path $env:TEMP 'Long Directory Name For Jolt'
          New-Item -ItemType Directory -Force -Path $long | Out-Null
          $short = (New-Object -ComObject Scripting.FileSystemObject).GetFolder($long).ShortPath
          Add-Type -Namespace Jolt -Name Win -MemberDefinition @'
          [DllImport("kernel32.dll", CharSet = CharSet.Unicode)]
          public static extern uint GetLongPathNameW(string s, System.Text.StringBuilder b, uint n);
          '@
          $sb = New-Object System.Text.StringBuilder 1024
          [void][Jolt.Win]::GetLongPathNameW($short, $sb, 1024)
          $expected = $sb.ToString()
          Write-Host "short=$short long=$expected"
          if ($short -eq $expected) { Write-Host 'no 8.3 alias on this volume; nothing to check'; exit 0 }
          $env:WINSHORT_DIR = $short
          $probe = Join-Path $env:RUNNER_TEMP 'canon.clj'
          Set-Content -Path $probe -Value @'
          (require '[babashka.fs :as fs])
          (let [short (System/getenv "WINSHORT_DIR")]
            (prn [(.getCanonicalPath (java.io.File. short))
                  (str (fs/real-path short))
                  (str (fs/canonicalize short))]))
          '@
          $out = (& $scheme --script host\chez\cli.ss $probe 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $l = $expected.Replace('\', '\\')
          $want = '["' + $l + '" "' + $l + '" "' + $l + '"]'
          if ($out -ne $want) { throw "a short name was not expanded: $out (want $want)" }

      # Closing a child's output stream while other threads are parked reading
      # it: the close used to free the buffer ReadFile was writing into (#1283).
      # The readers stay parked until the child next writes, as on the JVM; what
      # matters is that the close returns and nothing crashes.
      - name: Closing a pipe under a parked read
        shell: powershell
        run: |
          $scheme = Join-Path $env:GITHUB_WORKSPACE 'chez-install\bin\scheme.exe'
          $probe = Join-Path $env:RUNNER_TEMP 'pipeclose.clj'
          Set-Content -Path $probe -Value @'
          (require '[babashka.process :as p])
          (let [proc (p/process {:out :pipe :err :pipe}
                                "cmd" "/c" "ping -n 6 127.0.0.1 >NUL & echo late")
                out (:out proc)
                err (:err proc)
                r1 (future (try (slurp out) (catch Exception _ :closed)))
                r2 (future (try (slurp err) (catch Exception _ :closed)))]
            (Thread/sleep 1500)
            (.close out)
            (.close err)
            (System/gc)
            @proc
            (prn [:done (string? @r1) (string? @r2)]))
          (System/exit 0)
          '@
          $out = (& $scheme --script host\chez\cli.ss $probe 2>&1 | Out-String).Trim()
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "exit ${LASTEXITCODE}: $out" }
          if ($out -ne '[:done true true]') { throw "the close under a parked read: $out" }

      # The resolver's HTTPS transport on Windows: ws2_32 sockets and the
      # OpenSSL DLLs discovered under Git for Windows (ucrt64/bin from 2.56,
      # mingw64/bin before; the image decides which this run gets). The runner
      # image also has an OpenSSL of its own on PATH, which the bare-name
      # fallback would find, so a fetch that merely succeeds proves nothing
      # about the discovery: the smoke asserts that both libraries came from
      # the Git directory. Both separator spellings of the download path reach
      # FileOutputStream as a user's environment would spell them.
      - name: Fetch dependencies with forward-slash absolute paths
        env:
          JOLT_HTTPS_EXPECT_LIBDIR: Git/ucrt64/bin;Git/mingw64/bin
        run: TMPDIR="$(cygpath -m "$RUNNER_TEMP")" make CHEZ=./chez-install/bin/chez httpsfetch

      - name: Fetch dependencies with backslash absolute paths
        env:
          JOLT_HTTPS_EXPECT_LIBDIR: Git\ucrt64\bin;Git\mingw64\bin
        run: TMPDIR="$(cygpath -w "$RUNNER_TEMP")" make CHEZ=./chez-install/bin/chez httpsfetch
