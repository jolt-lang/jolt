name: release

# Build the self-contained jolt binary for each platform and attach it to the
# GitHub Release when a v* tag is pushed — and, daily, publish main as the
# rolling `vnightly` prerelease (`install --version nightly`) so a downstream
# project can test against unreleased jolt without building it. The binary
# bundles the runtime, compiler, jolt-core + stdlib source, the Chez boots, and a
# launcher stub, so it runs AND compiles jolt apps with no Chez or cc on the
# user's machine (jolt-eaj).
#
# No Apple notarization, mirroring dirge: macOS users who download the tarball
# clear Gatekeeper quarantine once (`xattr -d com.apple.quarantine jolt`), or
# install via a Homebrew tap that de-quarantines on install.
on:
  push:
    tags:
      # Release tags only. `vnightly` is a tag too — moved to main's head by the
      # schedule below — and it must never enter the release path.
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      nightly:
        description: "Publish this run as the rolling vnightly prerelease, as the daily schedule does (from main only). Unticked: a dry run — build and gate, publish nothing."
        type: boolean
        required: false
        default: false
  # main, daily: the same build and fleet gates as a release, then
  # publish-nightly replaces `vnightly`. The tag name is the install script's:
  # it does `tag="v${version#v}"` and `filename="jolt-${tag}-${target}.tar.gz"`,
  # so `--version nightly` resolves to jolt-vnightly-<target>.tar.gz with the
  # installer unchanged.
  schedule:
    - cron: '0 17 * * *'

permissions:
  contents: write   # create/update the GitHub Release and upload assets

jobs:
  # What this run IS, decided once and read by every job below. Three kinds:
  #
  #   release     a v<digits> tag was pushed. Assets named for the tag, drafted
  #               per platform, published (and the Homebrew tap bumped) once the
  #               fleet gates pass.
  #   nightly     the schedule, or a dispatch with `nightly` ticked, on main. The
  #               same build and gates, then `vnightly` is replaced. Reads
  #               `nightly-current` when this commit already IS the published
  #               nightly: nothing to build.
  #   dry-run     any other dispatch. Build and gate, publish nothing.
  #
  # A job output rather than a workflow `env`: the job-level `if:` that keeps a
  # nightly out of `publish`/`homebrew` and a release out of `publish-nightly`
  # cannot read `env`, and a condition spelled out per job drifts.
  #
  # The version build-jolt bakes into the binary is decided here too. A tag
  # names itself; everything else is tools/version.sh, the answer a dev checkout
  # gives (v0.8.0-56-g63374117), which needs the tags and the history back to
  # the newest one — hence fetch-depth 0. Once, on this runner, rather than per
  # build row: the Linux row builds inside a container where the mounted
  # checkout belongs to another user and git refuses to read it, and a shallow
  # checkout would answer with a bare sha.
  meta:
    name: what this run is
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.decide.outputs.kind }}
      tag: ${{ steps.decide.outputs.tag }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # The one place the nightly's triggers are spelled out.
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/vnightly)
              echo "::error::vnightly is the rolling nightly tag, not a release — dispatch from a branch"
              exit 1 ;;
            refs/tags/v[0-9]*)
              kind=release; tag="$GITHUB_REF_NAME"; version="$GITHUB_REF_NAME" ;;
            *)
              version="$(tools/version.sh)"
              if [ "$NIGHTLY" = true ]; then
                # A nightly is a build of main: by definition, and by what its
                # release notes say it is.
                if [ "$GITHUB_REF" != refs/heads/main ]; then
                  echo "::error::a nightly publishes only from main, not from $GITHUB_REF"
                  exit 1
                fi
                kind=nightly; tag=vnightly
                # Already published from this commit? Both the tag here AND the
                # release live, not just the tag: the release can be gone with
                # the tag still here (deleted by hand), or live with the tag
                # still on yesterday's commit (a run that died after publishing,
                # before the move). Either one reruns.
                at="$(gh api "repos/${GH_REPO}/git/ref/tags/vnightly" --jq .object.sha 2>/dev/null || true)"
                if [ "$at" = "$GITHUB_SHA" ] && gh api "repos/${GH_REPO}/releases/tags/vnightly" >/dev/null 2>&1; then
                  kind=nightly-current
                  echo "vnightly is already the published build of ${GITHUB_SHA}; nothing to do"
                fi
              else
                kind=dry-run; tag="$version"
              fi ;;
          esac
          echo "kind=${kind} tag=${tag} version=${version}"
          { echo "kind=${kind}"; echo "tag=${tag}"; echo "version=${version}"; } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: meta
    if: needs.meta.outputs.kind != 'nightly-current'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binary is built inside a manylinux2014 container (glibc
          # 2.17, gcc 10) with ncurses/tinfo/zlib linked statically, so the
          # prebuilt runs on any glibc distro since ~2014 (CentOS 7+, Ubuntu
          # 14.04+, Debian 8+, Amazon Linux 2+) — every >=2.33 symbol the old
          # runner-built binary demanded was a build-host artifact, not a real
          # API need (#452). Remaining dynamic deps: libuuid + glibc.
          - os: ubuntu-latest
            target: x86_64-linux
            shell: bash
            container-build: quay.io/pypa/manylinux2014_x86_64
          - os: macos-14
            target: aarch64-macos
            shell: bash
          # x86_64-macos is cross-built from the arm64 macos-14 runner (GitHub
          # retired the Intel runners): `cross: ta6osx` gates the extra Chez-cross
          # + pack steps below, and the binary is smoke-tested via Rosetta 2.
          - os: macos-14
            target: x86_64-macos
            shell: bash
            cross: ta6osx
          - os: windows-latest
            target: x86_64-windows
            shell: msys2 {0}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive   # vendor/irregex, used by the Chez regex shim

      # --- Linux: the whole Chez + jolt build runs inside the old-glibc
      # container (matrix.container-build) via ci/glibc-floor-build.sh — the
      # same script the glibc-floor probe validated. docker run, not
      # `container:`, because node-based actions can't run on a glibc-2.17
      # image. The container writes target/release/jolt into the mounted
      # workspace; every later step (smokes, package) runs on the host. ---
      - name: Clone Chez Scheme source (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch v10.4.1 --recurse-submodules \
            https://github.com/cisco/ChezScheme.git "$HOME/chez-src"

      - name: Cache Chez Scheme (Linux)
        if: runner.os == 'Linux'
        id: cache-chez
        uses: actions/cache@v4
        with:
          path: ~/chez-opt
          key: chez-manylinux2014-v10.4.1-static-v1

      - name: Build jolt in ${{ matrix.container-build }} (Linux)
        if: runner.os == 'Linux'
        env:
          JOLT_VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p "$HOME/chez-opt"
          docker run --rm \
            -v "$PWD":/src \
            -v "$HOME/chez-src":/chez-src:ro \
            -v "$HOME/chez-opt":/opt/chez \
            -w /src \
            -e JOLT_VERSION="$JOLT_VERSION" \
            -e STATIC_DEPS=1 \
            '${{ matrix.container-build }}' sh ci/glibc-floor-build.sh

      # --- macOS: Homebrew chezscheme ships `chez` plus the csv kernel dev files
      # (libkernel.a, scheme.h, *.boot), which is all build-jolt needs — and,
      # since it vendors lz4 rather than depending on the formula, the matching
      # liblz4.a next to them. The lz4 keg is only build.ss's fallback source of
      # a static archive for a Chez that arrived without one: the link names an
      # archive, never a dylib, so nothing installed here can become a runtime
      # dependency of the shipped binary (asserted below). ---
      - name: Install Chez Scheme (macOS)
        if: runner.os == 'macOS'
        run: brew install chezscheme lz4

      # --- Windows: MSYS2/MinGW-w64 toolchain + Chez built from source (ta6nt).
      # The whole job runs in the msys2 shell so cc/xxd/paths behave; the
      # produced jolt.exe is a plain Windows binary (no MSYS runtime dep). ---
      - name: Set up MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # inherit the runner PATH so GITHUB_PATH additions (the chez wrapper
          # dir) are visible inside the msys2 shell
          path-type: inherit
          install: >-
            git make vim unzip zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ntldd

      - name: Cache Chez Scheme (Windows)
        if: runner.os == 'Windows'
        id: cache-chez-win
        uses: actions/cache@v4
        with:
          path: chez-install
          key: chez-${{ matrix.os }}-v10.4.1-mingw64

      - name: Build Chez Scheme from source (Windows)
        if: runner.os == 'Windows' && steps.cache-chez-win.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme.git /tmp/chez-src
          cd /tmp/chez-src
          ./configure --threads
          make -j"$(nproc)"
          # `make install` drives the unix installsh through cmd and dies; the
          # build tree has everything — assemble the layout by hand. Boot files
          # sit next to scheme.exe (that's where the Windows kernel looks).
          inst="$GITHUB_WORKSPACE/chez-install"
          mkdir -p "$inst/bin" "$inst/csv"
          cp ta6nt/bin/ta6nt/*.exe "$inst/bin/"
          cp ta6nt/bin/ta6nt/*.dll "$inst/bin/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/bin/"
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/csv/"
          cp ta6nt/boot/ta6nt/scheme.h "$inst/csv/"
          cp ta6nt/boot/ta6nt/equates.h "$inst/csv/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/libkernel.a "$inst/csv/" || { echo "libkernel.a not found:"; find ta6nt -name "*.a" -o -name "kernel*"; exit 1; }

      - name: Put chez on PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          bindir="$GITHUB_WORKSPACE/chez-install/bin"
          { echo '#!/bin/sh'; echo "exec \"$bindir/scheme.exe\" \"\$@\""; } > "$bindir/chez"
          chmod +x "$bindir/chez"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "JOLT_CHEZ_CSV=$GITHUB_WORKSPACE/chez-install/csv" >> "$GITHUB_ENV"
          # cc is the build's compiler name; alias it to mingw gcc
          { echo '#!/bin/sh'; echo 'exec gcc "$@"'; } > "$bindir/cc"
          chmod +x "$bindir/cc"

      - name: Show Chez version
        if: runner.os != 'Linux'
        run: chez --version

      # --- x86_64-macos is cross-built on the arm64 runner (matrix.cross=ta6osx):
      # build the target boots/xpatch + cross kernel, then assemble a target pack
      # that `jolt build --target` / build-jolt.ss consume. ---
      - name: Cache Chez cross (ta6osx)
        if: matrix.cross
        id: cache-chez-cross
        uses: actions/cache@v4
        with:
          path: ~/chez-cross
          key: chez-cross-v10.4.1-tarm64osx-${{ matrix.cross }}-v1

      - name: Build ${{ matrix.cross }} boots/xpatch + cross kernel
        if: matrix.cross && steps.cache-chez-cross.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v10.4.1 --recurse-submodules \
            https://github.com/cisco/ChezScheme ~/chez-cross
          cd ~/chez-cross
          ./configure -m=tarm64osx && make -j"$(sysctl -n hw.ncpu)"
          make bootquick XM=${{ matrix.cross }}
          # minos: pin -mmacosx-version-min in the kernel AND the final link, or
          # the binary won't load on Macs older than the runner's OS.
          ./configure --cross --force -m=${{ matrix.cross }} \
            CFLAGS="-arch x86_64 -mmacosx-version-min=11.0" CC_FOR_BUILD=cc
          make -j"$(sysctl -n hw.ncpu)"

      - name: Assemble target pack + set cross env
        if: matrix.cross
        run: |
          CHEZ_SRC=~/chez-cross tools/cross-compile/make-pack.sh ${{ matrix.cross }} "$HOME/pack"
          echo "JOLT_TARGET_PACK=$HOME/pack" >> "$GITHUB_ENV"
          echo "JOLT_TARGET_ARCH_FLAG=-arch x86_64 -mmacosx-version-min=11.0" >> "$GITHUB_ENV"
          # every smoke below runs the produced x86_64 binary via Rosetta 2.
          echo "JOLT_RUN_PREFIX=arch -x86_64" >> "$GITHUB_ENV"

      # build-jolt compiles in a fresh Chez and cc-links; the checked-in seed is
      # the compiler image, so no selfhost re-mint (that byte-fixpoint is a
      # dev-machine check — see jolt-8479). `make jolt-release`, not `make jolt`.
      # JOLT_CROSS_TARGET is empty for native rows and the target machine for the cross
      # row (matrix.cross), which build-jolt.ss consumes with $JOLT_TARGET_PACK.
      - name: Build jolt (release)
        if: runner.os != 'Linux'
        run: make jolt-release JOLT_CROSS_TARGET="${{ matrix.cross }}"
        env:
          # Bake the version into the binary: the tag, or meta's describe string.
          JOLT_VERSION: ${{ needs.meta.outputs.version }}

      - name: Inspect the binary (Windows)
        if: runner.os == 'Windows'
        run: |
          set +e
          ls -la target/release/
          ntldd target/release/jolt.exe 2>&1 | head -20
          ./target/release/jolt.exe -e '(+ 1 2)'
          echo "exit=$?"

      # The prebuilt's whole promise is that it runs with nothing else installed,
      # and the Chez kernel's compressors (lz4, zlib) are jolt's to bake in --
      # lz4 is not a system library on either platform. The macOS binary shipped
      # demanding /opt/homebrew/opt/lz4/lib/liblz4.1.dylib, which is present only
      # on a Mac whose owner ran `brew install lz4`: the install script's own
      # `jolt --version` check died with a dyld error for everyone else, and
      # nothing in this workflow noticed. Now it would.
      - name: Assert the binary needs no library the target machine may not have
        if: runner.os != 'Windows'
        run: |
          bin=target/release/jolt
          if [ "${{ runner.os }}" = "macOS" ]; then
            otool -L "$bin"
            # Every load command must resolve inside the OS itself.
            bad="$(otool -L "$bin" | tail -n +2 | awk '{print $1}' \
                   | grep -Ev '^(/usr/lib/|/System/Library/)' || true)"
          else
            readelf -d "$bin" | grep NEEDED || true
            # ncurses/tinfo/uuid are the Linux build's own story (STATIC_DEPS,
            # and libuuid on top of glibc); the compression libraries are the
            # ones jolt bakes in itself, on every platform, so assert those.
            bad="$(readelf -d "$bin" | sed -n 's/.*Shared library: \[\(.*\)\]/\1/p' \
                   | grep -Ei 'lz4|libz\.' || true)"
          fi
          if [ -n "$bad" ]; then
            echo "::error::$bin needs libraries that are not on a stock machine:"
            echo "$bad"
            exit 1
          fi
          echo "no unexpected dynamic dependencies"

      # Sanity: the built binary runs (no Chez needed) and self-reports a value.
      - name: Smoke the binary
        run: |
          out="$($JOLT_RUN_PREFIX ./target/release/jolt -e '(reduce + (range 10))')"
          test "$out" = "45" || { echo "jolt -e gave '$out', want 45"; exit 1; }

      # The binary is a self-contained COMPILER: it must `build` an app with no
      # jolt source on disk. Run from an isolated dir (nothing but the tiny app)
      # so a build that reaches for host/chez/*.ss on the filesystem fails here,
      # not on a user's machine.
      - name: Smoke a self-contained build
        run: |
          jolt="$(pwd)/target/release/jolt"
          work="$(mktemp -d)"
          mkdir -p "$work/app/src/app"
          printf '{:paths ["src"]}\n' > "$work/app/deps.edn"
          printf '(ns app.core)\n(defn -main [& _] (println "built:" (reduce + (range 10))))\n' \
            > "$work/app/src/app/core.clj"
          ( cd "$work/app" && $JOLT_RUN_PREFIX "$jolt" build -m app.core -o app )
          out="$($JOLT_RUN_PREFIX "$work/app/app")"
          test "$out" = "built: 45" || { echo "self-contained build ran '$out', want 'built: 45'"; exit 1; }

      # A built binary must also run the DYNAMIC require path: a namespace not
      # in the static ns graph compiles from the source roots at runtime, so the
      # boot's top-level defines must be visible to the runtime compiler's eval
      # (issue #290: this died with "variable var-deref is not bound").
      - name: Smoke a runtime require in a built binary
        run: |
          jolt="$(pwd)/target/release/jolt"
          work="$(mktemp -d)"
          mkdir -p "$work/app/src/app"
          printf '{:paths ["src"]}\n' > "$work/app/deps.edn"
          printf '(ns app.extra)\n(defn greet [s] (str "Hello, " s "!"))\n' \
            > "$work/app/src/app/extra.clj"
          printf '(ns app.core)\n(defn -main [& _]\n  (println ((requiring-resolve (quote app.extra/greet)) "runtime")))\n' \
            > "$work/app/src/app/core.clj"
          ( cd "$work/app" && $JOLT_RUN_PREFIX "$jolt" build -m app.core -o app )
          out="$(cd "$work/app" && $JOLT_RUN_PREFIX ./app)"
          test "$out" = "Hello, runtime!" || { echo "runtime require ran '$out', want 'Hello, runtime!'"; exit 1; }

      - name: Package
        env:
          JOLT_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          ver="${JOLT_TAG}"
          name="jolt-${ver}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE "dist/${name}/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/jolt.exe "dist/${name}/jolt.exe"
            ( cd dist && zip -r "${name}.zip" "${name}" && sha256sum "${name}.zip" > "${name}.zip.sha256" )
          else
            cp target/release/jolt "dist/${name}/jolt"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
            ( cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          fi
          ls -la dist

      # The linux binary is what the fleet gates below run against, so hand it over
      # as a workflow artifact. A dry run creates no release, so the artifact — not
      # `gh release download` — is the only way to reach it. The gates find the
      # tarball by its `*x86_64-linux.tar.gz` suffix, so the version in its name
      # (a tag, or a describe string) is theirs to ignore.
      - name: Upload the linux binary for the fleet gates
        if: matrix.target == 'x86_64-linux'
        uses: actions/upload-artifact@v4
        with:
          name: jolt-x86_64-linux
          path: dist/**/*.tar.gz
          retention-days: 1

      # A nightly's assets go to publish-nightly as workflow artifacts, one per
      # platform, and touch no release until every gate has passed: that job is
      # the only writer of `vnightly`, so a red gate leaves the previous nightly
      # exactly as it was. Not a per-row release upload as the tag path does
      # below — that looks the release up by tag, which from the second night on
      # finds yesterday's PUBLISHED nightly and replaces its assets in place,
      # platform by platform, an hour before the gates have run.
      - name: Hand the assets to publish-nightly
        if: needs.meta.outputs.kind == 'nightly'
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          if-no-files-found: error
          retention-days: 1

      # DRAFT, so the release is not public until the fleet gates pass: `publish`
      # below flips it. A draft is invisible to the install script and to Homebrew
      # (both read the latest PUBLISHED release), so a fleet regression leaves a tag
      # with assets attached for inspection and nothing anyone can install —
      # i.e. the release aborts. Each matrix row creates-or-updates the same draft.
      - name: Upload to the GitHub Release (draft)
        if: needs.meta.outputs.kind == 'release'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
          fail_on_unmatched_files: false

  # --- fleet gates: the jolt-lang libraries and examples, on the tag's own binary.
  #
  # These run ONLY here (release.yml is `on: push: tags: v*` + workflow_dispatch +
  # the nightly schedule), so a regular commit or PR pays nothing for them —
  # tests.yml stays the per-commit gate. The cost lands once per release and once
  # per nightly, where it buys the thing the jolt-repo gate
  # structurally cannot see: whether a language change breaks real code that a user
  # would `git/sha`-pin. v0.5.13 is the case in point — making byte[] elements signed
  # was correct and fully green in-repo, and truncated every HTTP response body in
  # jolt-lang/http-client, because its ByteArrayInputStream.read() returned the raw
  # (now negative) element and every drain loop read that as EOF.
  #
  # Each row mirrors the library's OWN tests.yml — same apt packages, same
  # `JOLT_PWD="$PWD" jolt -M:test` — so a red row means the same thing here as in
  # that repo. ci/fleet-smoke.sh is the shared entrypoint (also runnable by hand
  # when a row goes red).
  #
  # Not covered here, deliberately:
  #   clojure/tools.cli   the jolt harness for it is local-only; nothing upstream to
  #                       check out.
  #   db's postgres half  its own job below, which needs a service container.
  libraries:
    name: library ${{ matrix.repo }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: jolt-crypto         # AES/HMAC/SHA over OpenSSL — all byte[] work
            apt: libssl3
          - repo: http-client         # TLS + gzip + HTTP over jolt.ffi
            apt: libssl3
          - repo: ring-chez-adapter   # BSD sockets over jolt.ffi
            apt: libssl3 curl
          - repo: db                  # sqlite over jolt.ffi (postgres: libraries-db)
            apt: libsqlite3-0
          - repo: transit-jolt
            apt: ''
          - repo: xml
            apt: libxml2
          - repo: yaml
            apt: ''
          - repo: time                # needs a non-English locale on the OS
            apt: locales
          - repo: logging
            apt: ''
          - repo: nrepl
            apt: ''
          - repo: router
            apt: ''
          - repo: glimmer             # reactive core; the suite is headless
            apt: libgtk-4-1
          - repo: glimmer-gtk         # its GTK4 backend
            apt: libgtk-4-1
          - repo: glimmer-gl          # + GL geometry/matrix
            apt: libgtk-4-1 libgl1
    steps:
      - name: Check out jolt (for ci/fleet-smoke.sh)
        uses: actions/checkout@v5
        with:
          path: jolt
      - name: Check out jolt-lang/${{ matrix.repo }}
        uses: actions/checkout@v5
        with:
          repository: jolt-lang/${{ matrix.repo }}
          path: lib
          # transit-jolt keeps the transit-format exemplars as a submodule and its
          # suite refuses to run without them; harmless for the repos with none.
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: jolt-x86_64-linux
      - name: Unpack the jolt under test
        run: |
          set -eu
          tgz="$(find . -name '*x86_64-linux.tar.gz' -print -quit)"
          [ -n "$tgz" ] || { echo "no linux tarball in the artifact"; exit 1; }
          # Into a directory of its own, and searched there and NOWHERE else: this
          # workspace also holds the jolt checkout, whose bin/jolt is an executable
          # file named `jolt` too. Unpacking into `.` and searching `.` let the
          # traversal decide which one won, and the extracted directory carries the
          # VERSION in its name, so the order flipped from one release to the next —
          # v0.5.16 picked up the checkout's dev launcher and every fleet gate died
          # on "No valid Chez Scheme executable found" against a perfectly good
          # binary.
          mkdir -p unpacked
          tar -xzf "$tgz" -C unpacked
          bin="$(find unpacked -type f -name jolt -perm -u+x -print -quit)"
          [ -n "$bin" ] || { echo "no jolt binary in $tgz"; exit 1; }
          mv "$bin" ./jolt-bin
          ./jolt-bin --version
      - name: Install the library's system deps
        run: |
          sudo apt-get update
          # liblz4/zlib/tinfo are jolt's own dynamic deps; the rest is per-library.
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 ${{ matrix.apt }}
      # jolt's DateTimeFormatter localizes month/day names through libc strftime, so
      # a non-English locale has to exist on the OS (the JVM bundles its own; jolt,
      # like babashka, does not). tick's suite formats a French month name.
      - name: Generate the fr_FR locale (time)
        if: matrix.repo == 'time'
        run: sudo locale-gen fr_FR.UTF-8 && sudo update-locale
      - name: Test
        run: jolt/ci/fleet-smoke.sh lib ./jolt-bin

  # db's postgres backend needs a live server, and `services` is job-level — so it
  # gets its own job rather than starting a postgres container for all 13 rows above.
  # Its suite skips the postgres section when JOLT_TEST_PG_URI is unset, which is why
  # the matrix row above still covers the sqlite half.
  libraries-db:
    name: library db (postgres)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jolt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
        with:
          path: jolt
      - uses: actions/checkout@v5
        with:
          repository: jolt-lang/db
          path: lib
      - uses: actions/download-artifact@v4
        with:
          name: jolt-x86_64-linux
      - name: Unpack the jolt under test
        run: |
          set -eu
          tgz="$(find . -name '*x86_64-linux.tar.gz' -print -quit)"
          [ -n "$tgz" ] || { echo "no linux tarball in the artifact"; exit 1; }
          # Own directory, searched there only — see the fleet job above: the jolt
          # checkout in this workspace also has an executable file named `jolt`.
          mkdir -p unpacked
          tar -xzf "$tgz" -C unpacked
          bin="$(find unpacked -type f -name jolt -perm -u+x -print -quit)"
          [ -n "$bin" ] || { echo "no jolt binary in $tgz"; exit 1; }
          mv "$bin" ./jolt-bin
          ./jolt-bin --version
      - run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 libpq5 libsqlite3-0
      - name: Test
        env:
          JOLT_TEST_PG_URI: postgres://postgres:postgres@127.0.0.1:5432/jolt_test
        run: jolt/ci/fleet-smoke.sh lib ./jolt-bin

  # Every example app BUILDS with this binary, and the ones with a headless test task
  # run it. The build is the valuable half: `jolt build` is the whole compiler
  # pipeline (analyze, tree-shake, direct-link, cc-link) over real third-party
  # dependency trees — ring/reitit/Selmer/honeysql/integrant/tick — which is far more
  # compiler surface than the in-repo build smokes reach. See ci/examples-smoke.sh
  # for the per-app manifest and why each build-only app is build-only.
  examples:
    name: examples
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          path: jolt
      - uses: actions/checkout@v5
        with:
          repository: jolt-lang/examples
          path: examples
      # glimmer-app, glimmer-gl-app and fps-demo consume glimmer as
      # {:local/root "../../glimmer"} — a SIBLING two levels up from the app dir,
      # i.e. the workspace root once examples/ is checked out under it. Their
      # deps.edn says the path is provisional ("push glimmer to a git remote and swap
      # to :git/url to make this app self-contained"), so honour the layout they have
      # rather than pinning a sha here that would then need chasing.
      - uses: actions/checkout@v5
        with:
          repository: jolt-lang/glimmer
          path: glimmer
      - uses: actions/checkout@v5
        with:
          repository: jolt-lang/glimmer-gtk
          path: glimmer-gtk
      - uses: actions/checkout@v5
        with:
          repository: jolt-lang/glimmer-gl
          path: glimmer-gl
      # glimmer-datastar consumes the datastar middleware the same way, as
      # {:local/root "../../datastar"} — and the repo behind it is jolt-lang's
      # glimmer-datastar (renamed from datastar), so the checkout path is the name
      # the app asks for, not the repo's.
      - uses: actions/checkout@v5
        with:
          repository: jolt-lang/glimmer-datastar
          path: datastar
      - uses: actions/download-artifact@v4
        with:
          name: jolt-x86_64-linux
      - name: Unpack the jolt under test
        run: |
          set -eu
          tgz="$(find . -name '*x86_64-linux.tar.gz' -print -quit)"
          [ -n "$tgz" ] || { echo "no linux tarball in the artifact"; exit 1; }
          # Own directory, searched there only — see the fleet job above: the jolt
          # checkout in this workspace also has an executable file named `jolt`.
          mkdir -p unpacked
          tar -xzf "$tgz" -C unpacked
          bin="$(find unpacked -type f -name jolt -perm -u+x -print -quit)"
          [ -n "$bin" ] || { echo "no jolt binary in $tgz"; exit 1; }
          mv "$bin" ./jolt-bin
          ./jolt-bin --version
      - name: Install system deps
        run: |
          sudo apt-get update
          # jolt's own deps, plus every native library any example declares: the GUI
          # apps are built (not run), but jolt loads a declared :jolt/native at
          # require time, so the .so has to be present to compile them.
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6 build-essential \
            libssl3 libsqlite3-0 libgtk-4-1 libgl1
      - name: Build every example, run the test tasks
        run: jolt/ci/examples-smoke.sh examples ./jolt-bin

  # Throughput. `make test` and `make libconformance` check that answers are right;
  # neither notices when they get slower. bench/arrays went 5.4x on a codegen change
  # with all 88 ci targets and all 47 libraries still green, so the suite runs here
  # too, against the PREVIOUS release rather than against a checked-in millisecond
  # figure: both compilers build the same bench sources on this one runner, and the
  # gate reads the ratio. A number in ms would false-fail whenever the runner was
  # slow and pass on a fast one while hiding a real regression.
  #
  # Compares the release being cut against the newest published release — never
  # the rolling nightly, which is a prerelease and excluded below. Skipped,
  # loudly, when there is no earlier release to compare against.
  bench:
    name: benchmarks vs the last release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: jolt
      - uses: actions/download-artifact@v4
        with:
          name: jolt-x86_64-linux
      - name: Install build deps
        run: |
          sudo apt-get update
          # cc + the runtime's own shared deps: the gate BUILDS each bench with
          # both compilers, so this needs the same toolchain `jolt build` does.
          sudo apt-get install -y build-essential liblz4-1 zlib1g libtinfo6
      - name: Unpack the jolt under test
        run: |
          set -eu
          tgz="$(find . -maxdepth 2 -name '*x86_64-linux.tar.gz' -print -quit)"
          [ -n "$tgz" ] || { echo "no linux tarball in the artifact"; exit 1; }
          # Own directory, searched there only — the jolt checkout in this
          # workspace also has an executable file named `jolt`.
          mkdir -p unpacked-cand
          tar -xzf "$tgz" -C unpacked-cand
          bin="$(find unpacked-cand -type f -name jolt -perm -u+x -print -quit)"
          [ -n "$bin" ] || { echo "no jolt binary in $tgz"; exit 1; }
          mv "$bin" ./jolt-cand
          ./jolt-cand --version
      - name: Fetch the previous release
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          # The newest PUBLISHED release, which is the last one users could have
          # installed. This tag's own release is still a draft at this point, so it
          # cannot select itself; --exclude-drafts says so regardless, and
          # --exclude-pre-releases keeps `vnightly` out, so a nightly is gated
          # against the last release rather than against yesterday's nightly.
          tag="$(gh release list --limit 20 --exclude-drafts --exclude-pre-releases \
                   --json tagName --jq '.[0].tagName' 2>/dev/null || true)"
          if [ -z "$tag" ] || [ "$tag" = "null" ]; then
            echo "none=1" >> "$GITHUB_OUTPUT"
            echo "no published release to compare against — nothing to gate"
            exit 0
          fi
          echo "comparing against $tag"
          gh release download "$tag" --pattern '*x86_64-linux.tar.gz' --dir prev-dl
          mkdir -p unpacked-base
          tar -xzf prev-dl/*x86_64-linux.tar.gz -C unpacked-base
          bin="$(find unpacked-base -type f -name jolt -perm -u+x -print -quit)"
          [ -n "$bin" ] || { echo "no jolt binary in the $tag tarball"; exit 1; }
          mv "$bin" ./jolt-base
          ./jolt-base --version
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Benchmark suite vs ${{ steps.prev.outputs.tag }}
        if: steps.prev.outputs.none != '1'
        run: jolt/ci/bench-gate.sh ./jolt-base ./jolt-cand
      - name: No previous release
        if: steps.prev.outputs.none == '1'
        run: echo "First release — no baseline to compare against, bench gate skipped."

  # Flip the draft release public. Nothing downstream (install script, Homebrew tap)
  # sees the release until this runs, so a red fleet gate aborts the release with the
  # tag and assets intact for inspection.
  publish:
    name: publish the release
    needs: [meta, build, libraries, libraries-db, examples, bench]
    if: needs.meta.outputs.kind == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Un-draft ${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          JOLT_TAG: ${{ needs.meta.outputs.tag }}
        run: gh release edit "${JOLT_TAG}" --draft=false --latest

  # The nightly's counterpart to `publish`, behind the same gates. `vnightly` is
  # REPLACED, never edited: this build is staged as a draft with every asset
  # attached, the previous nightly is deleted, the draft is published under the
  # tag, and the tag is moved to this commit. Nothing anyone can install changes
  # before the delete, so a run that dies earlier — a red gate, a lost runner —
  # leaves the previous nightly exactly as it was, and the window with no
  # installable nightly is the one API call between the delete and the publish.
  #
  # Staged under a name that is not the tag (`vnightly-staging`), so nothing
  # about the draft can collide with the live `vnightly` while both exist, and
  # addressed by release id throughout: here a tag name may mean the old
  # release, the new one, or a draft an earlier run left behind.
  publish-nightly:
    name: publish nightly
    needs: [meta, build, libraries, libraries-db, examples, bench]
    if: needs.meta.outputs.kind == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # A dispatch alongside the schedule: the swaps run one at a time.
    concurrency:
      group: publish-nightly
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nightly-*
          merge-multiple: true
          path: dist
      - name: Replace vnightly with this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          ls -la dist
          # A fork's nightly lives on the fork, and the installer needs telling.
          repo_flag=""
          [ "$GH_REPO" = jolt-lang/jolt ] || repo_flag=" --repo ${GH_REPO}"
          body="$(printf '%s\n' \
            "Rolling build of \`main\`, replaced daily. Not a release: no compatibility promise, and it may be broken. \`jolt --version\` reports \`${VERSION}\`." \
            "" \
            "    curl -sSL https://raw.githubusercontent.com/${GH_REPO}/main/install | bash -s -- --version nightly${repo_flag}" \
            "" \
            "Built from ${SHA}.")"

          # 1. Stage: a draft with every asset attached. Nothing visible yet.
          id="$(gh api -X POST "repos/${GH_REPO}/releases" \
                  -f tag_name=vnightly-staging -f name=nightly -f target_commitish="$SHA" \
                  -F draft=true -F prerelease=true -f make_latest=false -f body="$body" \
                  --jq .id)"
          echo "staged draft ${id}"
          for f in dist/*; do
            gh api -X POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/${GH_REPO}/releases/${id}/assets?name=$(basename "$f")" \
              --input "$f" --jq '"  \(.name) (\(.size) bytes)"'
          done

          # 2. Retire the previous nightly, and any staging draft a run that
          #    died between here and the publish left behind.
          gh api --paginate "repos/${GH_REPO}/releases" \
            --jq ".[] | select((.tag_name == \"vnightly\" or .tag_name == \"vnightly-staging\") and .id != ${id}) | .id" \
          | while read -r old; do
              echo "deleting release ${old}"
              gh api -X DELETE "repos/${GH_REPO}/releases/${old}"
            done

          # 3. Publish under the tag, then move the tag. Publishing binds the
          #    release to `vnightly` as it stands — yesterday's commit — or
          #    creates it here on the first night, so the move comes after,
          #    forced. prerelease + make_latest=false: releases/latest is the
          #    newest NON-prerelease, and a bare `install` and the Homebrew tap
          #    both read it, so a nightly never displaces the real release.
          gh api -X PATCH "repos/${GH_REPO}/releases/${id}" \
            -f tag_name=vnightly -F draft=false -F prerelease=true -f make_latest=false \
            --jq '"published \(.tag_name): \(.assets | length) assets, \(.html_url)"'
          gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/vnightly" \
            -f sha="$SHA" -F force=true \
            --jq '"vnightly -> \(.object.sha)"'

  # Bump the Homebrew tap (jolt-lang/homebrew-jolt) to this tag: rewrite each
  # platform's url + sha256 in Formula/jolt.rb from the release's .sha256 assets.
  # Needs a HOMEBREW_TAP_TOKEN secret — a PAT with contents:write on the tap repo
  # (the default GITHUB_TOKEN can't push to another repo). Skipped if unset.
  # After `publish`, so the tap never points at a release the fleet gates rejected.
  homebrew:
    name: update homebrew tap
    needs: [meta, publish]
    if: needs.meta.outputs.kind == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Token present?
        id: tok
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TAP_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "HOMEBREW_TAP_TOKEN unset — skipping tap bump"; fi

      - name: Read release checksums
        if: steps.tok.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOLT_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          ver="${JOLT_TAG}"
          sha() { gh release download "$ver" --repo "${{ github.repository }}" -p "$1.sha256" -O - | awk '{print $1}'; }
          {
            echo "VER=$ver"
            echo "MAC_SHA=$(sha "jolt-${ver}-aarch64-macos.tar.gz")"
            echo "LIN_SHA=$(sha "jolt-${ver}-x86_64-linux.tar.gz")"
          } >> "$GITHUB_ENV"

      - name: Checkout tap
        if: steps.tok.outputs.ok == 'true'
        uses: actions/checkout@v4
        with:
          repository: jolt-lang/homebrew-jolt
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Bump + push formula
        if: steps.tok.outputs.ok == 'true'
        run: |
          set -euo pipefail
          base="https://github.com/${{ github.repository }}/releases/download/${VER}"
          python3 - tap/Formula/jolt.rb "$base" "$VER" "$MAC_SHA" "$LIN_SHA" <<'PY'
          import re, sys
          path, base, ver, mac, lin = sys.argv[1:6]
          s = open(path).read()
          # one-time transition off the pre-rename formula: rewrite every joltc
          # token (bin.install, test stanza, old asset urls) to jolt. Idempotent —
          # a formula already on the new name has no joltc tokens left.
          s = s.replace('joltc', 'jolt')
          def bump(s, target, sha):
              url = f'{base}/jolt-{ver}-{target}.tar.gz'
              s = re.sub(r'url "[^"]*' + re.escape(target) + r'\.tar\.gz"', f'url "{url}"', s)
              s = re.sub(r'(jolt-' + re.escape(ver) + '-' + re.escape(target) + r'\.tar\.gz"\s*\n\s*sha256 ")[0-9a-f]{64}',
                         r'\g<1>' + sha, s)
              return s
          s = bump(s, 'aarch64-macos', mac)
          s = bump(s, 'x86_64-linux', lin)
          open(path, 'w').write(s)
          PY
          cd tap
          git config user.name "jolt-release[bot]"
          git config user.email "jolt-release@users.noreply.github.com"
          git add Formula/jolt.rb
          git commit -m "jolt ${VER}"
          git push
