name: metrics

# Publishes the findings as a report, and fails the build (ci/metrics-gate.clj) on
# a critical finding under a path ci/metrics-allow.edn holds critical-free, or on
# unused code beyond that file's allowlist.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: metrics-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # jolt runs the gate script. jolt-metrics is the latest release's standalone
  # binary, so its fixes arrive without a change here.
  JOLT_VERSION: v0.8.27

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # hotspots read churn from the git history
          fetch-depth: 0
      - name: Install jolt
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install | bash -s -- --version "$JOLT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install jolt-metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo jlt-commons/jolt-metrics --pattern '*-x86_64-linux.tar.gz' --dir "$RUNNER_TEMP"
          tar xzf "$RUNNER_TEMP"/jolt-metrics-*-x86_64-linux.tar.gz -C "$RUNNER_TEMP"
          mkdir -p "$HOME/.local/bin"
          install "$RUNNER_TEMP"/jolt-metrics-*-x86_64-linux/jolt-metrics "$HOME/.local/bin/"
          gh release view --repo jlt-commons/jolt-metrics --json tagName -q '"jolt-metrics " + .tagName'
      - name: Run jolt-metrics
        run: |
          jolt-metrics . metrics-report.md --top 50
          # the summary stops before the long per-file tables
          awk '/^## Cleanup candidates/{exit} {print}' metrics-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check for critical findings and unused code
        run: |
          # the gate reads the queue and cleanup only, so it skips the slow
          # search for abstraction opportunities
          jolt-metrics . metrics-report.edn --format edn --no-abstractions
          jolt ci/metrics-gate.clj metrics-report.edn ci/metrics-allow.edn
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: metrics-report
          path: metrics-report.md
