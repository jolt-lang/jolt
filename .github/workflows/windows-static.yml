name: windows-static

# The Windows build paths no POSIX runner can observe, end to end through the
# jolt.exe a release ships: a `jolt build` whose app links MSYS2's OpenSSL 3
# static archives as :static natives, from a drive-absolute output path whose
# .build directory does not exist yet, and whose entry namespace calls into both
# libraries while it loads (so the build itself has to resolve them).
#
#   #1205  the build-time preload of libssl.a has to resolve libcrypto.a
#   #1206  libcrypto.a needs crypt32 at the final link, which the crypto entry
#          now states itself with :link-libs (checked with a cc that drops
#          jolt's own -lcrypt32)
#   #1207  bld-mkdir-p walking up a backslash path
#   #1203  jolt.loader opening a file:/C:/… resource hit   (winparity)
#   #1208  Socket half-close over Winsock                  (winparity)
#
# The first run of a new workflow file comes from a push: workflow_dispatch only
# lists workflows that exist on the default branch.
on:
  workflow_dispatch:
  pull_request:
  push:
    paths:
      - '.github/workflows/windows-static.yml'
      - 'host/chez/build.ss'
      - 'host/chez/build-jolt.ss'
      - 'jolt-core/jolt/main.clj'
      - 'jolt-core/jolt/deps.clj'
      - 'host/chez/loader.ss'
      - 'host/chez/java/io.ss'
      - 'host/chez/java/io-streams.ss'
      - 'stdlib/jolt/loader.clj'
      - 'stdlib/jolt/socket.clj'
      - 'test/chez/win-*.ss'
      - 'test/chez/win-parity-smoke.clj'

jobs:
  static-openssl:
    name: Static OpenSSL app on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive   # vendor/irregex, used by the Chez regex shim

      # The release builder's toolchain (release.yml), plus MSYS2's OpenSSL 3,
      # which ships the static libcrypto.a / libssl.a beside the import libs.
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          # inherit the runner PATH so GITHUB_PATH additions (the chez wrapper
          # dir) are visible inside the msys2 shell
          path-type: inherit
          install: >-
            git make vim zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ntldd
            mingw-w64-x86_64-openssl

      # Same key as tests.yml's windows-deps and release.yml's Windows row: the
      # same Chez, built the same way.
      - name: Cache Chez Scheme
        id: cache-chez-win
        uses: actions/cache@v5
        with:
          path: chez-install
          key: chez-windows-latest-v10.4.1-mingw64

      - name: Build Chez Scheme from source
        if: steps.cache-chez-win.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v10.4.1 https://github.com/cisco/ChezScheme.git /tmp/chez-src
          cd /tmp/chez-src
          ./configure --threads
          make -j"$(nproc)"
          # `make install` drives the unix installsh through cmd and dies; the
          # build tree has everything — assemble the layout by hand. Boot files
          # sit next to scheme.exe (that's where the Windows kernel looks).
          inst="$GITHUB_WORKSPACE/chez-install"
          mkdir -p "$inst/bin" "$inst/csv"
          cp ta6nt/bin/ta6nt/*.exe "$inst/bin/"
          cp ta6nt/bin/ta6nt/*.dll "$inst/bin/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/bin/"
          cp ta6nt/boot/ta6nt/petite.boot ta6nt/boot/ta6nt/scheme.boot "$inst/csv/"
          cp ta6nt/boot/ta6nt/scheme.h "$inst/csv/"
          cp ta6nt/boot/ta6nt/equates.h "$inst/csv/" 2>/dev/null || true
          cp ta6nt/boot/ta6nt/libkernel.a "$inst/csv/" || { echo "libkernel.a not found:"; find ta6nt -name "*.a" -o -name "kernel*"; exit 1; }

      - name: Put chez on PATH
        run: |
          bindir="$GITHUB_WORKSPACE/chez-install/bin"
          { echo '#!/bin/sh'; echo "exec \"$bindir/scheme.exe\" \"\$@\""; } > "$bindir/chez"
          chmod +x "$bindir/chez"
          echo "$bindir" >> "$GITHUB_PATH"
          echo "JOLT_CHEZ_CSV=$GITHUB_WORKSPACE/chez-install/csv" >> "$GITHUB_ENV"
          # cc is the build's compiler name; alias it to mingw gcc
          { echo '#!/bin/sh'; echo 'exec gcc "$@"'; } > "$bindir/cc"
          chmod +x "$bindir/cc"

      # The self-contained jolt.exe, as release.yml builds it: `jolt build` with
      # :static natives relinks its bundled launcher stub with the system cc.
      - name: Build jolt.exe
        run: make jolt-release

      - name: Write the OpenSSL app
        run: |
          set -e
          crypto="$(cygpath -m /mingw64/lib/libcrypto.a)"
          ssl="$(cygpath -m /mingw64/lib/libssl.a)"
          test -f "$crypto" && test -f "$ssl"
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          app="$tmp/static-openssl/app"
          rm -rf "$tmp/static-openssl"
          mkdir -p "$app/src/app"
          # libssl first: the dependent archive, which the old per-archive preload
          # could never load on its own. The crypto entry states the system
          # libraries libcrypto.a links against (its .pc's Libs.private), as
          # jolt-lang/crypto's own declaration does.
          cat > "$app/deps.edn" <<EOF
          {:paths ["src"]
           :jolt/native [{:name "ssl"    :static {:archive "$ssl"}}
                         {:name "crypto" :static {:archive "$crypto"}
                          :link-libs {:windows ["ws2_32" "gdi32" "crypt32"]}}]}
          EOF
          # The top-level defs call both libraries while the namespace loads, so
          # the build resolves them in its own process before it links anything.
          # OpenSSL_version_num returns an unsigned long, 32 bits on Win64.
          cat > "$app/src/app/core.clj" <<'EOF'
          (ns app.core
            (:require [jolt.ffi :as ffi]))
          (ffi/defcfn openssl-version-num "OpenSSL_version_num" [] :uint)
          (ffi/defcfn tls-client-method "TLS_client_method" [] :pointer)
          (ffi/defcfn ssl-ctx-new "SSL_CTX_new" [:pointer] :pointer)
          (ffi/defcfn ssl-ctx-free "SSL_CTX_free" [:pointer] :void)
          (defn- ctx? []
            (let [ctx (ssl-ctx-new (tls-client-method))]
              (if (ffi/null? ctx) false (do (ssl-ctx-free ctx) true))))
          (def version (openssl-version-num))
          (def ctx-at-load (ctx?))
          (defn -main [& _]
            (println "crypto:" (>= version 0x30000000))
            (println "ssl:" (ctx?))
            (println "at load:" ctx-at-load))
          EOF
          cat "$app/deps.edn"

      # A "/"-spelled drive path (cygpath -m) whose .build walk ends at a
      # directory that exists: #1205 and #1206 without #1207 in the way.
      - name: "Static OpenSSL app, forward-slash output path (#1205, #1206)"
        if: ${{ !cancelled() }}
        run: |
          set -e
          jolt="$GITHUB_WORKSPACE/target/release/jolt.exe"
          base="$(cygpath -m "$RUNNER_TEMP")/static-openssl"
          out="$base/out-slash/bin/app"
          # A cc that records each command and drops any -lcrypt32 from jolt's
          # own system list (everything after -static), so the link has to get
          # crypt32 from the crypto entry's :link-libs.
          wrap="$(cygpath -u "$RUNNER_TEMP")/ccwrap"
          mkdir -p "$wrap"
          export CCLOG="$wrap/cc.log"
          : > "$CCLOG"
          cat > "$wrap/cc" <<'EOF'
          #!/bin/sh
          echo "cc $*" >> "$CCLOG"
          static=
          for a do
            shift
            [ "$a" = -static ] && static=1
            if [ -n "$static" ] && [ "$a" = -lcrypt32 ]; then
              echo "dropped jolt's own -lcrypt32" >> "$CCLOG"; continue
            fi
            set -- "$@" "$a"
          done
          exec gcc "$@"
          EOF
          chmod +x "$wrap/cc"
          ( cd "$(cygpath -u "$RUNNER_TEMP")/static-openssl/app" && PATH="$wrap:$PATH" "$jolt" build -m app.core -o "$out" )
          cat "$CCLOG"
          # the final link (the launcher relink) and the preload both carry the
          # spec's libraries right after the archives, and crypt32 only there
          for kind in launcher.c native-static.so; do
            line="$(grep -- "$kind" "$CCLOG" | tail -1)"
            echo "$line" | grep -q -- "libcrypto.a -Wl,--no-whole-archive -lws2_32 -lgdi32 -lcrypt32 -static" \
              || { echo "::error::the $kind link does not carry crypto's :link-libs after the archives"; exit 1; }
            n="$(echo "$line" | tr ' ' '\n' | grep -c -- '^-lcrypt32$')"
            test "$n" = 1 || { echo "::error::the $kind link names -lcrypt32 $n times"; exit 1; }
          done
          exe="$(cygpath -u "$out").exe"
          ntldd "$exe"
          if ntldd "$exe" | grep -Ei 'libcrypto|libssl'; then
            echo "::error::the app imports an OpenSSL DLL; the archives were not linked in"; exit 1
          fi
          got="$("$exe" | tr -d '\r')"
          want="$(printf 'crypto: true\nssl: true\nat load: true')"
          echo "$got"
          test "$got" = "$want" || { echo "::error::app printed '$got', want '$want'"; exit 1; }

      # The native spelling kmet's build passed: backslashes, drive-absolute, and
      # neither out-back\bin nor app.exe.build there yet (#1207).
      - name: "Static OpenSSL app, backslash output path (#1207)"
        if: ${{ !cancelled() }}
        run: |
          set -e
          jolt="$GITHUB_WORKSPACE/target/release/jolt.exe"
          base="$(cygpath -w "$RUNNER_TEMP")\\static-openssl"
          out="$base\\out-back\\bin\\app"
          echo "output path: $out"
          ( cd "$(cygpath -u "$RUNNER_TEMP")/static-openssl/app" && "$jolt" build -m app.core -o "$out" )
          exe="$(cygpath -u "$out").exe"
          test -d "$(cygpath -u "$out").exe.build" || { echo "::error::no $out.exe.build"; exit 1; }
          got="$("$exe" | tr -d '\r')"
          want="$(printf 'crypto: true\nssl: true\nat load: true')"
          echo "$got"
          test "$got" = "$want" || { echo "::error::app printed '$got', want '$want'"; exit 1; }

      # jolt.loader opening a file:/C:/… hit (#1203) and the Socket half-close
      # over Winsock (#1208) are rows of the parity smoke; winpath pins the
      # Windows path-parent walk (#1207) from the table side.
      - name: Loader resources, socket half-close and path rows on Windows
        if: ${{ !cancelled() }}
        run: make CHEZ=./chez-install/bin/chez winpath winplatform winparity
